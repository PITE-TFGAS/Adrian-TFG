<!DOCTYPE html>
<html lang="es">

<head>
  <!-- WorkflowsPlayer popup: authentication, tour listing, and workflow sync from Supabase. -->
  <meta charset="UTF-8">
  <title>Mis Guías</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <span style="font-size: 24px;">??</span>
    <h2>Mis Guías</h2>
  </div>

  <div id="loginForm" class="auth-card">
    <div class="form-group">
      <input type="email" id="email" placeholder="Correo electrónico">
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Contraseña">
    </div>
    <div class="btn-group">
      <button id="btnLogin" class="btn-primary">Entrar</button>
      <button id="btnRegister" class="btn-secondary">Registrarse</button>
    </div>
    <p id="authMessage" class="message"></p>
  </div>

  <div id="userInfo" class="auth-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="user-email" id="userEmail"></span>
      <button id="btnLogout" class="btn-logout" style="width: auto; margin: 0; padding: 5px 10px;">Salir</button>
    </div>

    <div id="status">
    </div>

    <button id="btnSync" class="btn-primary" style="margin-top: 10px;">
      ?? Sincronizar Guías
    </button>
  </div>

  <script src="../libs/supabase.min.js"></script>
  <script src="../auth/supabase-client.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="popup.js"></script>
</body>

</html>
