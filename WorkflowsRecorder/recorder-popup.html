<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Grabador de Workflows</title>
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      color: #333;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eee;
    }
    .header h2 { margin: 0; font-size: 20px; color: #d32f2f; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #d32f2f; }
    
    .controls { display: flex; flex-direction: column; gap: 12px; }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    
    #btn-start { background: #d32f2f; color: white; }
    #btn-start:hover { background: #b71c1c; }
    #btn-start:disabled { background: #ccc; cursor: not-allowed; }
    
    #btn-stop { background: #333; color: white; display: none; }
    #btn-stop:hover { background: #000; }
    
    #btn-clear { background: #f5f5f5; color: #666; font-size: 13px; }
    #btn-clear:hover { background: #eee; }
    
    #btn-save { background: #4caf50; color: white; display: none; }
    #btn-save:hover { background: #388e3c; }

    #recording-status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      background: #fff3e0;
      color: #e65100;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      border: 1px solid #ffe0b2;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 24px;">🎥</span>
    <h2>Grabador</h2>
  </div>

  <div id="recording-status">
    🔴 Grabando... <strong id="steps-count">0</strong> pasos
  </div>

  <div class="form-group" id="name-container">
    <label for="workflow-name">Nombre del tutorial:</label>
    <input type="text" id="workflow-name" placeholder="Ej: Cómo pedir cita">
  </div>

  <div class="controls">
    <button id="btn-start">
      <span>▶️</span> Empezar a grabar
    </button>
    <button id="btn-stop">
      <span>⏹️</span> Terminar grabación
    </button>
    <button id="btn-save">
      <span>☁️</span> Subir a la nube
    </button>
    <button id="btn-clear">
      <span>🗑️</span> Borrar todo
    </button>
  </div>

  <div id="auth-status" style="margin-top: 15px; font-size: 12px; color: #666; text-align: center;">
    <!-- Auth info -->
  </div>

  <script src="supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="recorder-popup.js"></script>
</body>
</html>
